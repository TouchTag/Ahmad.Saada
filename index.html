*{box-sizing:border-box}

body{

        135deg,

        #1a1a1a,
        #000000
    );
    background-size: 300% 300%;
    animation: gradientMove 15s ease infinite;

@keyframes gradientMove{

    50%{background-position:100% 50%;}

}

.wrap{

.sbtn{

  color:#fff;
  text-decoration:none;
}

.map{
  margin:8px 0 14px;
  border-radius:18px;

.map iframe{

  height:180px;

.map a{

  text-decoration:none;

.btn b{

.txt small{

.footer{

  color:#bdbdd0;
  font-size:15px;
  margin-top:20px;
